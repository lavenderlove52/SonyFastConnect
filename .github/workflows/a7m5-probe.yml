name: A7M5 protocol probe

on:
  push:
    paths:
      - ".github/workflows/a7m5-probe.yml"
      - "tools/a7m5-probe/**"
  pull_request:
    paths:
      - ".github/workflows/a7m5-probe.yml"
      - "tools/a7m5-probe/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: tools/a7m5-probe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/a7m5-probe/go.mod
          cache-dependency-path: tools/a7m5-probe/go.sum

      - name: Run unit and virtual-camera tests
        run: go test ./...

      - name: Run race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build probe
        run: go build -trimpath -o a7m5-probe-ci .

      - name: Create checksum on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $hash = (Get-FileHash -LiteralPath a7m5-probe-ci -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  a7m5-probe-ci" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Create checksum on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: shasum -a 256 a7m5-probe-ci > SHA256SUMS.txt

      - name: Upload probe and checksum
        uses: actions/upload-artifact@v7
        with:
          name: a7m5-probe-${{ runner.os }}
          path: |
            tools/a7m5-probe/a7m5-probe-ci
            tools/a7m5-probe/SHA256SUMS.txt
          if-no-files-found: error

      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install-go.ps1

      - name: Smoke-test macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n install-go.sh
          bash -n install-go.command
          chmod +x install-go.sh install-go.command
          ./install-go.sh
